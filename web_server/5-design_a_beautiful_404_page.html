<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page not found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #f5f5f7;
      background: radial-gradient(circle at 20% 20%, #3a2a6b, #14112b 60%, #0b0a1a);
      overflow: hidden;
    }
    .card { padding: 2rem; max-width: 36rem; }
    .code {
      font-size: clamp(6rem, 25vw, 12rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(90deg, #ff7a59, #ffcc33, #5de0e6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: float 4s ease-in-out infinite;
    }
    h1 { font-size: 1.8rem; margin: 1rem 0 .5rem; }
    p { color: #b9b6d3; line-height: 1.6; margin-bottom: 2rem; }
    a {
      display: inline-block;
      padding: .8rem 1.8rem;
      border-radius: 999px;
      background: #ffcc33;
      color: #14112b;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
    }
    a:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(255, 204, 51, .35); }
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      opacity: .6;
      animation: twinkle 3s infinite;
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: .9; } }
  </style>
</head>
<body>
  <span class="star" style="top:12%;left:15%"></span>
  <span class="star" style="top:25%;left:80%;animation-delay:1s"></span>
  <span class="star" style="top:70%;left:25%;animation-delay:2s"></span>
  <span class="star" style="top:82%;left:70%;animation-delay:.5s"></span>
  <span class="star" style="top:45%;left:92%;animation-delay:1.5s"></span>
  <div class="card">
    <div class="code">404</div>
    <h1>Ceci n'est pas une page</h1>
    <p>The page you are looking for does not exist, was moved, or never made it out of the imagination.</p>
    <a href="/">Back to the homepage</a>
  </div>
</body>
</html>
